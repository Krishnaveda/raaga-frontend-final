<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Prajna - Raaga Identifier</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
            border-radius: 15px;
            color: white;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .control-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #e9ecef;
        }
        
        .control-group h3 {
            color: #667eea;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .button-row {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-record {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-record:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-stop {
            background: #ff6b6b;
            color: white;
            display: none;
        }
        
        .btn-stop:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }
        
        .btn-upload {
            background: linear-gradient(135deg, #51cf66, #40c057);
            color: white;
        }
        
        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(81, 207, 102, 0.3);
        }
        
        .btn-identify {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 15px;
            font-size: 16px;
            margin-top: 10px;
        }
        
        .btn-identify:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.3);
        }
        
        input[type="file"] {
            display: none;
        }
        
        .file-input-label {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #51cf66, #40c057);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s;
            display: block;
        }
        
        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(81, 207, 102, 0.3);
        }
        
        .status {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .status.recording {
            background: #ffe0e0;
            color: #d32f2f;
            border: 2px solid #ff6b6b;
        }
        
        .status.ready {
            background: #e8f5e9;
            color: #388e3c;
            border: 2px solid #51cf66;
        }
        
        .result {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            border: 2px solid #667eea;
        }
        
        .result.show {
            display: block;
        }
        
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .result-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .result-label {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .result-value {
            color: #333;
            font-size: 20px;
            font-weight: 700;
        }
        
        .confidence {
            color: #667eea;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .feedback {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #e9ecef;
        }
        
        .feedback.show {
            display: block;
        }
        
        .feedback-buttons {
            display: flex;
            gap: 10px;
        }
        
        .feedback-buttons button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
        }
        
        .btn-correct {
            background: linear-gradient(135deg, #51cf66, #40c057);
            color: white;
        }
        
        .btn-wrong {
            background: linear-gradient(135deg, #ff6b6b, #ff5252);
            color: white;
        }
        
        .alternatives {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        
        .alt-raga {
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            border-left: 4px solid #667eea;
        }
        
        .swaras-display {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }
        
        .swara-tag {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 10px;
            margin: 3px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
        }
        
        @media (max-width: 600px) {
            .controls {
                grid-template-columns: 1fr;
            }
            
            .result-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="prajna-icon.png" alt="Music Prajna" class="logo">
            <h1>🎻 Music Prajna</h1>
            <p class="subtitle">Identify Indian Classical Raaga</p>
        </div>

        <div class="status" id="status"></div>

        <div class="controls">
            <div class="control-group">
                <h3>🎤 Record</h3>
                <div class="button-row">
                    <button class="btn-record" onclick="startRecording()">Record</button>
                    <button class="btn-stop" id="stopBtn" onclick="stopRecording()">Stop</button>
                </div>
            </div>

            <div class="control-group">
                <h3>📁 Upload</h3>
                <label class="file-input-label">
                    Upload File
                    <input type="file" id="audioFile" accept=".mp3,.wav,.flac,.m4a" onchange="fileSelected()">
                </label>
            </div>
        </div>

        <button class="btn-identify" onclick="identifyRaaga()">🔍 Identify Raaga</button>

        <div class="loading" id="loading">
            <p>Analyzing audio...</p>
            <div class="spinner"></div>
        </div>

        <div class="result" id="result">
            <div class="result-grid">
                <div class="result-item">
                    <div class="result-label">Raaga</div>
                    <div class="result-value" id="ragaName">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Melakartha</div>
                    <div class="result-value" id="melakartha">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Confidence</div>
                    <div class="result-value confidence" id="confidence">-</div>
                </div>
            </div>

            <div class="swaras-display" id="swarasDisplay"></div>

            <div class="alternatives">
                <h4 style="margin-bottom: 10px; color: #333;">Other Matches</h4>
                <div id="alternatives"></div>
            </div>

            <div class="feedback" id="feedback">
                <p style="margin-bottom: 12px; color: #666; font-size: 14px;">Was this correct?</p>
                <div class="feedback-buttons">
                    <button class="btn-correct" onclick="submitFeedback(true)">✓ Correct</button>
                    <button class="btn-wrong" onclick="submitFeedback(false)">✗ Wrong</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://7a0412c0-bcf1-412f-b3c6-405cbed650a2-00-3ole6ry0dhua1.sisko.replit.dev';
        
        let mediaRecorder;
        let audioChunks = [];
        let recordedBlob = null;
        let selectedFile = null;

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    recordedBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    updateStatus('✓ Recording saved', 'ready');
                };

                mediaRecorder.start();
                document.querySelector('.btn-record').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'block';
                updateStatus('🔴 Recording...', 'recording');
            } catch (error) {
                alert('Microphone access denied');
            }
        }

        function stopRecording() {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            document.querySelector('.btn-record').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
        }

        function fileSelected() {
            selectedFile = document.getElementById('audioFile').files[0];
            if (selectedFile) {
                updateStatus(`✓ File: ${selectedFile.name}`, 'ready');
            }
        }

        function updateStatus(msg, cls) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = 'status ' + cls;
        }

        async function identifyRaaga() {
            const audioToSend = recordedBlob || selectedFile;

            if (!audioToSend) {
                alert('Please record or upload audio first');
                return;
            }

            const formData = new FormData();
            formData.append('audio', audioToSend);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').classList.remove('show');

            try {
                const response = await fetch(`${API_URL}/api/identify`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.status === 'success') {
                    const match = data.top_match;
                    document.getElementById('ragaName').textContent = match.raaga;
                    document.getElementById('melakartha').textContent = `#${match.melakartha}`;
                    document.getElementById('confidence').textContent = match.confidence + '%';
                    
                    const swarasHtml = data.identified_swaras.map(s => 
                        `<span class="swara-tag">${s}</span>`
                    ).join(' ');
                    document.getElementById('swarasDisplay').innerHTML = swarasHtml;
                    
                    const altHtml = data.alternatives.map(alt =>
                        `<div class="alt-raga"><span>${alt.raaga}</span><span>${alt.confidence}%</span></div>`
                    ).join('');
                    document.getElementById('alternatives').innerHTML = altHtml;
                    
                    document.getElementById('result').classList.add('show');
                    document.getElementById('feedback').classList.add('show');
                    
                    window.currentPrediction = match.raaga;
                    window.currentSwaras = data.identified_swaras;
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error connecting to backend');
            }

            document.getElementById('loading').style.display = 'none';
        }

        async function submitFeedback(isCorrect) {
            const actual = isCorrect ? window.currentPrediction : prompt('What is the correct raaga?');

            if (actual) {
                try {
                    await fetch(`${API_URL}/api/feedback`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            predicted: window.currentPrediction,
                            actual: actual,
                            confidence: document.getElementById('confidence').textContent,
                            swaras: window.currentSwaras
                        })
                    });

                    alert('Thank you for your feedback!');
                    document.getElementById('feedback').classList.remove('show');
                } catch (error) {
                    console.error(error);
                }
            }
        }
    </script>
</body>
</html>
