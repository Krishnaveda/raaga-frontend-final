<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Prajna - Raaga Identifier</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }
        
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
            overflow: hidden;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }
        
        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }
        
        .container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.4), 
                        0 0 60px rgba(255, 107, 107, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
            max-width: 1000px;
            width: 100%;
            animation: slideInDown 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 3s infinite;
            z-index: 0;
        }
        
        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .content {
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 30px;
            border-radius: 25px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateZ(0deg); }
            50% { transform: translateY(-15px) rotateZ(5deg); }
        }
        
        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            font-weight: 800;
            letter-spacing: -1px;
        }
        
        .subtitle {
            font-size: 16px;
            opacity: 0.95;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .status {
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 15px;
            animation: slideIn 0.3s ease-out;
            border: 2px solid;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .status.recording {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: white;
            border-color: #ff5252;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
            animation: pulse-glow 1s ease-in-out infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 107, 107, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 107, 107, 0.8); }
        }
        
        .status.ready {
            background: linear-gradient(135deg, #51cf66, #40c057);
            color: white;
            border-color: #3ab43f;
            box-shadow: 0 10px 25px rgba(81, 207, 102, 0.3);
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .control-group {
            background: linear-gradient(135deg, #f8f9ff, #f0f4ff);
            padding: 20px;
            border-radius: 20px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .control-group:hover {
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.15);
            transform: translateY(-5px);
        }
        
        .control-group h3 {
            color: #667eea;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 800;
        }
        
        .button-row {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.3);
            animation: slideBtn 0.3s ease;
        }
        
        @keyframes slideBtn {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .btn-record {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-record:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-record:active {
            transform: translateY(-1px);
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: white;
            display: none;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .btn-stop:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }
        
        .file-input-label {
            display: block;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #51cf66, #40c057);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 5px 15px rgba(81, 207, 102, 0.2);
        }
        
        .file-input-label:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(81, 207, 102, 0.4);
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn-identify {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
            background-size: 200% 200%;
            color: white;
            padding: 16px;
            font-size: 16px;
            margin-top: 10px;
            animation: gradientMove 3s ease infinite;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
        }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .btn-identify:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.5);
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            padding: 30px;
        }
        
        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(240, 147, 251, 0.05));
            padding: 25px;
            border-radius: 20px;
            margin-top: 25px;
            display: none;
            border: 2px solid rgba(102, 126, 234, 0.2);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.1);
        }
        
        .result.show {
            display: block;
            animation: slideInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .result-item {
            background: linear-gradient(135deg, #ffffff, #f8f9ff);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border: 1px solid rgba(102, 126, 234, 0.1);
            transition: all 0.3s ease;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .result-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }
        
        .result-label {
            color: #667eea;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: 800;
        }
        
        .result-value {
            color: #333;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .swaras-display {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
            border: 2px solid rgba(102, 126, 234, 0.1);
        }
        
        .swara-tag {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 6px 12px;
            margin: 4px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .alternatives {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
            border: 2px solid rgba(102, 126, 234, 0.1);
        }
        
        .alternatives h4 {
            margin-bottom: 12px;
            color: #667eea;
            font-weight: 800;
        }
        
        .alt-raga {
            padding: 12px;
            margin: 8px 0;
            background: linear-gradient(135deg, #f8f9ff, #f0f4ff);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .alt-raga:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        .feedback {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(102, 126, 234, 0.2);
        }
        
        .feedback.show {
            display: block;
        }
        
        .feedback-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn-correct {
            background: linear-gradient(135deg, #51cf66, #40c057);
            color: white;
        }
        
        .btn-wrong {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: white;
        }
        
        @media (max-width: 700px) {
            .controls {
                grid-template-columns: 1fr;
            }
            
            .result-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 32px;
            }
            
            .container {
                padding: 20px;
            }
            
            .logo {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="content">
            <div class="header">
                <img src="prajna-icon.png" alt="Music Prajna" class="logo">
                <h1>🎻 MUSIC PRAJNA</h1>
                <p class="subtitle">Identify Indian Classical Raaga</p>
            </div>

            <div class="status" id="status"></div>

            <div class="controls">
                <div class="control-group">
                    <h3>🎤 Record</h3>
                    <div class="button-row">
                        <button class="btn-record" onclick="startRecording()">Record</button>
                        <button class="btn-stop" id="stopBtn" onclick="stopRecording()">Stop</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>📁 Upload</h3>
                    <label class="file-input-label">
                        Upload File
                        <input type="file" id="audioFile" accept=".mp3,.wav,.flac,.m4a" onchange="fileSelected()">
                    </label>
                </div>
            </div>

            <button class="btn-identify" onclick="identifyRaaga()">🔍 IDENTIFY RAAGA</button>

            <div class="loading" id="loading">
                <p>Analyzing your audio...</p>
                <div class="spinner"></div>
            </div>

            <div class="result" id="result">
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-label">Raaga</div>
                        <div class="result-value" id="ragaName">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Melakartha</div>
                        <div class="result-value" id="melakartha">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Confidence</div>
                        <div class="result-value" id="confidence">-</div>
                    </div>
                </div>

                <div class="swaras-display" id="swarasDisplay"></div>

                <div class="alternatives">
                    <h4>Other Matches</h4>
                    <div id="alternatives"></div>
                </div>

                <div class="feedback" id="feedback">
                    <p style="margin-bottom: 15px; color: #666; font-size: 14px;">Was this correct?</p>
                    <div class="feedback-buttons">
                        <button class="btn-correct" onclick="submitFeedback(true)">✓ Correct</button>
                        <button class="btn-wrong" onclick="submitFeedback(false)">✗ Wrong</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create animated particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (20 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        const API_URL = 'https://7a0412c0-bcf1-412f-b3c6-405cbed650a2-00-3ole6ry0dhua1.sisko.replit.dev';
        
        let mediaRecorder;
        let audioChunks = [];
        let recordedBlob = null;
        let selectedFile = null;

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    recordedBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    updateStatus('✓ Recording saved', 'ready');
                };

                mediaRecorder.start();
                document.querySelector('.btn-record').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'block';
                updateStatus('🔴 Recording...', 'recording');
            } catch (error) {
                alert('Microphone access denied');
            }
        }

        function stopRecording() {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            document.querySelector('.btn-record').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
        }

        function fileSelected() {
            selectedFile = document.getElementById('audioFile').files[0];
            if (selectedFile) {
                updateStatus(`✓ File: ${selectedFile.name}`, 'ready');
            }
        }

        function updateStatus(msg, cls) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = 'status ' + cls;
        }

        async function identifyRaaga() {
            const audioToSend = recordedBlob || selectedFile;

            if (!audioToSend) {
                alert('Please record or upload audio first');
                return;
            }

            const formData = new FormData();
            formData.append('audio', audioToSend);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').classList.remove('show');

            try {
                const response = await fetch(`${API_URL}/api/identify`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.status === 'success') {
                    const match = data.top_match;
                    document.getElementById('ragaName').textContent = match.raaga;
                    document.getElementById('melakartha').textContent = `#${match.melakartha}`;
                    document.getElementById('confidence').textContent = match.confidence + '%';
                    
                    const swarasHtml = data.identified_swaras.map(s => 
                        `<span class="swara-tag">${s}</span>`
                    ).join(' ');
                    document.getElementById('swarasDisplay').innerHTML = swarasHtml;
                    
                    const altHtml = data.alternatives.map(alt =>
                        `<div class="alt-raga"><span>${alt.raaga}</span><span>${alt.confidence}%</span></div>`
                    ).join('');
                    document.getElementById('alternatives').innerHTML = altHtml;
                    
                    document.getElementById('result').classList.add('show');
                    document.getElementById('feedback').classList.add('show');
                    
                    window.currentPrediction = match.raaga;
                    window.currentSwaras = data.identified_swaras;
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error connecting to backend');
            }

            document.getElementById('loading').style.display = 'none';
        }

        async function submitFeedback(isCorrect) {
            const actual = isCorrect ? window.currentPrediction : prompt('What is the correct raaga?');

            if (actual) {
                try {
                    await fetch(`${API_URL}/api/feedback`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            predicted: window.currentPrediction,
                            actual: actual,
                            confidence: document.getElementById('confidence').textContent,
                            swaras: window.currentSwaras
                        })
                    });

                    alert('Thank you for your feedback!');
                    document.getElementById('feedback').classList.remove('show');
                } catch (error) {
                    console.error(error);
                }
            }
        }
    </script>
</body>
</html>
